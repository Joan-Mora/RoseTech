services:
  web:
    build:
      context: .
      args:
        VITE_GOOGLE_MAPS_KEY: ${VITE_GOOGLE_MAPS_KEY:-}
        VITE_GOOGLE_MAPS_MAP_ID: ${VITE_GOOGLE_MAPS_MAP_ID:-}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "8787"
      API_HOST: "0.0.0.0"
      TRUST_PROXY: "1"
    ports:
      - "8787:8787"
    restart: unless-stopped
